<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Приглашение</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Great+Vibes&display=swap">
<style>
html,body{margin:0;height:100%}
#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;box-sizing:border-box;
 background:radial-gradient(ellipse at 50% 40%,#F8FBFD 0%,#EEF4F8 55%,#DAE8F2 100%);font-family:'Cormorant Garamond',Georgia,serif;color:#17151D;text-align:center}
#gate .card{position:relative;width:min(760px,100%);padding:clamp(28px,6vh,56px) clamp(20px,5vw,64px);box-sizing:border-box;display:flex;flex-direction:column;align-items:center;
 border:1.5px solid rgba(1,72,180,.6);outline:1px solid rgba(1,72,180,.3);outline-offset:-10px}
#gate .seal{width:clamp(150px,26vh,240px);height:auto;animation:bloom 1.2s ease-out both}
#gate h1{font-family:'Great Vibes','Cormorant Garamond',cursive;font-weight:400;font-size:clamp(44px,7.5vh,76px);color:#0148B4;margin:10px 0 0;line-height:1.1;animation:rise .9s ease-out .4s both}
#gate .div{width:240px;height:32px;margin:10px 0 6px;animation:rise .8s ease-out .6s both}
#gate p{margin:0;font-style:italic;font-size:clamp(18px,2.6vh,24px);color:#4F6672;animation:rise .8s ease-out .7s both}
#gate form{display:flex;flex-direction:column;align-items:center;gap:18px;margin-top:22px;animation:rise .8s ease-out .9s both}
#gate input{font:inherit;font-size:clamp(20px,3vh,26px);padding:6px 4px;border:none;border-bottom:1.5px solid rgba(1,72,180,.55);background:transparent;color:#17151D;outline:none;width:min(320px,70vw);text-align:center;letter-spacing:.06em}
#gate input::placeholder{color:#839BA5;font-style:italic;letter-spacing:0}
#gate input:focus{border-bottom-color:#0148B4}
#gate button{font:inherit;font-size:clamp(18px,2.6vh,22px);letter-spacing:.18em;text-transform:uppercase;font-weight:600;padding:10px 28px;border:1.5px solid #0148B4;outline:1px solid rgba(1,72,180,.3);outline-offset:3px;background:transparent;color:#0148B4;cursor:pointer;transition:background .2s,color .2s}
#gate button:hover{background:#0148B4;color:#F7FAFC}
#gate .eyebrow{font-size:clamp(15px,2.2vh,19px);letter-spacing:.2em;text-transform:uppercase;font-style:normal;font-weight:600;color:#0148B4;margin-top:4px}
#gate .q{font-style:normal;font-size:clamp(20px,3vh,28px);color:#17151D;line-height:1.35;margin-top:10px;max-width:560px}
#err{min-height:26px;margin-top:10px!important;color:#B8737A!important}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes bloom{from{opacity:0;transform:scale(.94)}}
</style></head><body>

async function open_(pw){const raw=await pb(pw,D.s,D.n,256);
 const k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},k,u(D.c));return JSON.parse(new TextDecoder().decode(pt))}
function mount(p){const st=document.createElement('style');st.textContent=p.style;document.head.appendChild(st);
 const t=document.createElement('template');t.innerHTML=p.body;const sc=[...t.content.querySelectorAll('script')];sc.forEach(s=>s.remove());
 document.getElementById('gate').remove();document.body.appendChild(t.content);
 sc.forEach(s=>{const n=document.createElement('script');n.textContent=s.textContent;document.body.appendChild(n)})}
let step=0;const got=[];const $=id=>document.getElementById(id);
$('f').onsubmit=async e=>{e.preventDefault();const v=norm($('pw').value);const err=$('err');if(!v){err.textContent='Ответ, пожалуйста';return}
 const pre=[...got,v].join('|');
 if(step<Q.length-1){err.textContent='Сверяю…';const c=await pb(pre,D.chk[step][0],200000,128);
  if(btoa(String.fromCharCode(...c))!==D.chk[step][1]){err.textContent='Неверно. Попробуйте ещё раз.';return}
  got.push(v);step++;err.textContent='';$('qn').textContent='Вопрос '+R[step]+' из '+R[Q.length-1];$('qt').textContent=Q[step];$('pw').value='';
  if(step===Q.length-1)$('btn').textContent='Вскрыть печать';$('pw').focus();return}
 err.textContent='Вскрываю…';
 try{const p=await open_(pre);try{sessionStorage.setItem('k',pre)}catch(_){};mount(p)}
 catch(_){err.textContent='Неверно. Попробуйте ещё раз.'}};
(async()=>{let k=null;try{k=sessionStorage.getItem('k')}catch(_){};if(k){try{mount(await open_(k))}catch(_){}}})();
</script>
</body></html>
